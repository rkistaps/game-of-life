<html>

<head>
    <title>Game of Life</title>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #05100b;
            --rim: rgba(127, 217, 171, 0.16);
            --panel-bg: rgba(6, 18, 13, 0.78);
            --panel-border: rgba(127, 217, 171, 0.22);
            --text: #8fe6b8;
            --text-dim: #5c9478;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--void);
            font-family: "IBM Plex Mono", monospace;
            overflow: hidden;
        }

        #field {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: block;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 8, 5, 0.7) 100%);
        }

        .panel {
            position: fixed;
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            user-select: none;
        }

        .hud {
            top: 20px;
            left: 20px;
        }

        .hud-title {
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
        }

        .hud-line {
            color: var(--text-dim);
            font-size: 11px;
            line-height: 1.6;
        }

        .scoreboard {
            top: 20px;
            right: 20px;
            min-width: 168px;
        }

        .scoreboard-title {
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        .score-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 11px;
            color: var(--text-dim);
        }

        .score-rank {
            width: 12px;
            opacity: 0.7;
        }

        .score-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex: none;
        }

        .score-label {
            flex: 1;
        }

        .score-len {
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }
    </style>
</head>

<body>

    <canvas width="0" height="0" id="field"></canvas>
    <div class="vignette"></div>

    <div class="hud panel">
        <div class="hud-title">Game of Life</div>
        <div class="hud-line" id="hud-gen">Generation 0</div>
        <div class="hud-line" id="hud-pop">Population 0</div>
    </div>

    <div class="scoreboard panel">
        <div class="scoreboard-title">Scoreboard</div>
        <div id="scoreboard-rows"></div>
    </div>

    <script src="game.js"></script>
</body>

</html>
